name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci

      - run: npm run check

      - run: npm pack --dry-run

      - name: Bump the patch version
        id: version
        run: |
          VERSION=$(npm version patch --no-git-tag-version)
          echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --access public

      - name: Commit and tag the release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main --follow-tags

      - name: Create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "v$VERSION" --generate-notes
